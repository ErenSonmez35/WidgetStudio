name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: APK derle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk WidgetStudio-${{ github.run_number }}.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: WidgetStudio-${{ github.run_number }}
          path: WidgetStudio-${{ github.run_number }}.apk

      - name: Release oluştur (telefondan kolay indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Widget Stüdyo 1.0.${{ github.run_number }}
          body: "Commit: ${{ github.event.head_commit.message || 'elle başlatıldı' }}"
          files: WidgetStudio-${{ github.run_number }}.apk
